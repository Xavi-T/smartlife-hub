<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9EA"/>
      <stop offset="0.55" stop-color="#F6F9EF"/>
      <stop offset="1" stop-color="#E9F7F6"/>
    </linearGradient>
    <linearGradient id="brand" x1="170" y1="142" x2="680" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FBE42"/>
      <stop offset="1" stop-color="#168BD0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17365D" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:78px;font-weight:800;letter-spacing:.2px;fill:#17365D}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:600;fill:#426078}
      .chip{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#17365D}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#17365D}
    </style>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/>
  <circle cx="1370" cy="100" r="260" fill="#168BD0" opacity=".08"/>
  <circle cx="1080" cy="585" r="330" fill="#5FBE42" opacity=".09"/>
  <path d="M0 560C160 522 284 524 458 566C682 620 830 578 1000 530C1180 480 1362 480 1600 540V650H0V560Z" fill="#E8C88A" opacity=".35"/>

  <g filter="url(#softShadow)">
    <rect x="70" y="70" width="720" height="510" rx="36" fill="white" opacity=".86"/>
    <rect x="102" y="104" width="116" height="116" rx="26" fill="#FFF9EA" stroke="#D7E9D1"/>
    <image href="/logoSH.png" x="119" y="121" width="82" height="82" preserveAspectRatio="xMidYMid meet"/>
    <text x="104" y="282" class="title">Tư vấn dinh dưỡng</text>
    <text x="104" y="368" class="title" fill="url(#brand)">cá nhân</text>
    <text x="108" y="430" class="sub">BMI • TDEE • Calo mục tiêu • Macro gợi ý</text>
    <g transform="translate(108 478)">
      <rect width="190" height="52" rx="26" fill="#EAF7E5"/>
      <text x="24" y="34" class="chip">Dễ hiểu</text>
      <rect x="214" width="238" height="52" rx="26" fill="#E8F4FC"/>
      <text x="238" y="34" class="chip">Theo mục tiêu</text>
      <rect x="478" width="160" height="52" rx="26" fill="#FFF3D7"/>
      <text x="502" y="34" class="chip">An toàn</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="900" y="88" width="560" height="470" rx="34" fill="#F9E2B1"/>
    <rect x="934" y="122" width="492" height="402" rx="28" fill="#FFFDF7"/>
    <rect x="978" y="372" width="404" height="18" rx="9" fill="#D8AD6A"/>
    <rect x="978" y="426" width="404" height="18" rx="9" fill="#D8AD6A"/>
    <rect x="1018" y="220" width="100" height="152" rx="14" fill="#E8F4FC" stroke="#B8D9EE"/>
    <rect x="1140" y="182" width="102" height="190" rx="14" fill="#EAF7E5" stroke="#BDE2B3"/>
    <rect x="1264" y="242" width="76" height="130" rx="13" fill="#FFF3D7" stroke="#E8C88A"/>
    <circle cx="1068" cy="198" r="28" fill="#168BD0"/>
    <path d="M1057 198H1079M1068 187V209" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <path d="M1192 154C1172 124 1185 96 1220 82C1230 116 1220 142 1192 154Z" fill="#5FBE42"/>
    <path d="M1202 154C1224 124 1254 128 1276 154C1244 174 1220 174 1202 154Z" fill="#7ED957"/>
    <text x="1014" y="408" class="label">Chỉ số cơ thể</text>
