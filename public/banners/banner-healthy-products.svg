<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFF4"/>
      <stop offset=".5" stop-color="#FFF9EA"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="140" y1="170" x2="680" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FBE42"/>
      <stop offset="1" stop-color="#168BD0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17365D" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:76px;font-weight:800;fill:#17365D}
      .accent{font-family:Arial,Helvetica,sans-serif;font-size:76px;font-weight:800;fill:url(#brand)}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:600;fill:#536B80}
      .product{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800;fill:#17365D}
    </style>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/>
  <path d="M0 100C208 48 358 58 540 116C746 182 892 174 1078 118C1276 58 1430 40 1600 80V0H0V100Z" fill="#D8AD6A" opacity=".2"/>
  <circle cx="1362" cy="130" r="270" fill="#168BD0" opacity=".08"/>
  <circle cx="1160" cy="585" r="340" fill="#5FBE42" opacity=".09"/>

  <g filter="url(#shadow)">
    <rect x="78" y="76" width="782" height="498" rx="40" fill="white" opacity=".9"/>
    <text x="126" y="232" class="title">Gian hàng</text>
    <text x="126" y="320" class="accent">dinh dưỡng lành mạnh</text>
    <text x="130" y="392" class="sub">Yến mạch • hạt chia • granola • sữa hạt</text>
    <image href="/logoSH.png" x="130" y="442" width="72" height="72" preserveAspectRatio="xMidYMid meet"/>
    <rect x="222" y="452" width="386" height="54" rx="27" fill="#E8F4FC"/>
    <text x="254" y="487" class="product">Chọn nhanh theo nhu cầu sức khỏe</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="110" width="460" height="410" rx="36" fill="#F1D7A5"/>
    <rect x="986" y="146" width="388" height="338" rx="28" fill="#FFFDF7"/>
    <ellipse cx="1120" cy="356" rx="130" ry="74" fill="#EAF7E5"/>
    <circle cx="1068" cy="348" r="42" fill="#7ED957"/>
    <circle cx="1120" cy="330" r="48" fill="#5FBE42"/>
    <circle cx="1178" cy="358" r="40" fill="#168BD0"/>
    <rect x="1248" y="238" width="76" height="164" rx="18" fill="#E8F4FC"/>
    <rect x="1262" y="260" width="48" height="28" rx="14" fill="#168BD0" opacity=".24"/>
    <rect x="1018" y="228" width="92" height="142" rx="18" fill="#FFF3D7"/>
    <rect x="1032" y="252" width="64" height="34" rx="17" fill="#D8AD6A" opacity=".45"/>
    <path d="M1102 230C1080 196 1098 162 1136 148C1144 188 1134 216 1102 230Z" fill="#5FBE42"/>
    <path d="M1120 232C1150 196 1186 204 1210 236C1174 254 1146 254 1120 232Z" fill="#7ED957"/>
  </g>
</svg>
