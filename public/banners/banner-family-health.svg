<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.55" stop-color="#FFF6E2"/>
      <stop offset="1" stop-color="#ECF8EF"/>
    </linearGradient>
    <linearGradient id="blueGreen" x1="180" y1="130" x2="610" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168BD0"/>
      <stop offset="1" stop-color="#5FBE42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17365D" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:74px;font-weight:800;fill:#17365D}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:600;fill:#536B80}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#17365D}
    </style>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/>
  <rect x="0" y="520" width="1600" height="130" fill="#D8AD6A" opacity=".18"/>
  <circle cx="190" cy="520" r="270" fill="#168BD0" opacity=".08"/>
  <circle cx="1450" cy="80" r="290" fill="#5FBE42" opacity=".1"/>

  <g filter="url(#shadow)">
    <rect x="78" y="74" width="780" height="502" rx="38" fill="white" opacity=".88"/>
    <text x="126" y="218" class="title">Nâng tầm sức khỏe</text>
    <text x="126" y="306" class="title" fill="url(#blueGreen)">gia đình Việt</text>
    <text x="130" y="376" class="sub">Kiến thức dễ áp dụng cho bữa ăn mỗi ngày</text>
    <g transform="translate(130 430)">
      <rect width="186" height="58" rx="29" fill="#EAF7E5"/>
      <text x="28" y="37" class="small">Ăn cân bằng</text>
      <rect x="210" width="220" height="58" rx="29" fill="#E8F4FC"/>
      <text x="238" y="37" class="small">Theo dõi sức khỏe</text>
      <rect x="456" width="194" height="58" rx="29" fill="#FFF3D7"/>
      <text x="488" y="37" class="small">Chọn sản phẩm</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="966" y="82" width="446" height="486" rx="42" fill="#F4D59B"/>
    <rect x="1008" y="124" width="362" height="402" rx="32" fill="#FFFDF7"/>
    <image href="/logoSH.png" x="1151" y="146" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>
    <path d="M1090 336C1090 278 1137 232 1195 232C1253 232 1300 278 1300 336C1300 394 1253 440 1195 440C1137 440 1090 394 1090 336Z" fill="#E8F4FC"/>
    <path d="M1134 335C1134 301 1162 273 1196 273C1230 273 1258 301 1258 335C1258 369 1230 397 1196 397C1162 397 1134 369 1134 335Z" fill="#168BD0" opacity=".16"/>
    <path d="M1196 257V414M1116 336H1276" stroke="#168BD0" stroke-width="14" stroke-linecap="round" opacity=".92"/>
    <path d="M1086 456H1308" stroke="#D8AD6A" stroke-width="18" stroke-linecap="round"/>
    <path d="M1105 488H1289" stroke="#D8AD6A" stroke-width="18" stroke-linecap="round" opacity=".72"/>
  </g>
</svg>
